<section class="nearby-panel" [attr.aria-label]="'common.tripGo.nearby.title' | transloco">
  <header class="nearby-panel__header">
    <mat-icon aria-hidden="true">near_me</mat-icon>
    <strong>{{ 'common.tripGo.nearby.title' | transloco }}</strong>
  </header>
  <div class="nearby-panel__body">
    <div class="nearby-grid">
      <app-weather-tile [persist]="false" [place]="place()"></app-weather-tile>
      <app-air-quality-tile [persist]="false" [place]="place()"></app-air-quality-tile>
      <app-wikipedia-tile [place]="place()"></app-wikipedia-tile>
      <app-message-tile [place]="place()" [radiusMeters]="2000"></app-message-tile>
      <app-tripgo-secret-drop-tile [place]="place()" [radiusMeters]="2000"></app-tripgo-secret-drop-tile>

      @for (tile of placeholderTiles; track tile.titleKey) {
        @if (!tile.private || isAuthenticated()) {
          <article class="nearby-tile">
            <header><mat-icon aria-hidden="true">{{ tile.icon }}</mat-icon><strong>{{ tile.titleKey | transloco }}</strong></header>
            <div class="nearby-tile__status">
              <mat-icon aria-hidden="true">hourglass_top</mat-icon>
              <span>{{ 'common.tripGo.nearby.comingSoon' | transloco }}</span>
            </div>
          </article>
        }
      }
    </div>
  </div>
</section>
