<div class="checkers-board">@for(i of cells;track i){<button type="button" class="checkers-cell" [class.checkers-cell--dark]="isDark(i)" [class.checkers-cell--selectable]="isSelectable(i)" [class.checkers-cell--destination]="isDestination(i)" [class.checkers-cell--selected]="selected()===i||game()?.forcedPieceIndex===i" [disabled]="disabled()||(!isSelectable(i)&&!isDestination(i))" (click)="choose(i)" (pointerenter)="(isSelectable(i)||isDestination(i))&&feedback.notifyHover()">@if(pieceAt(i);as piece){<span class="checkers-piece" [class.checkers-piece--x]="piece.mark==='X'" [class.checkers-piece--o]="piece.mark==='O'"><span class="checkers-piece__mark">{{piece.mark}}</span>@if(piece.king){<span class="checkers-piece__king">♛</span>}</span>}</button>}</div>
