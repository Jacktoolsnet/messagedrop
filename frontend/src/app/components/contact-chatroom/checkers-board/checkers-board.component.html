<div class="checkers-board">@for(i of displayedCells();track i){<button type="button" class="checkers-cell" [class.checkers-cell--dark]="isDark(i)" [class.checkers-cell--last-move]="isLastMoveCell(i)" [class.checkers-cell--selectable]="isSelectable(i)" [class.checkers-cell--destination]="isDestination(i)" [class.checkers-cell--selected]="selected()===i||game()?.forcedPieceIndex===i" [disabled]="disabled()||(!isSelectable(i)&&!isDestination(i))" (click)="choose(i)" (pointerenter)="(isSelectable(i)||isDestination(i))&&feedback.notifyHover()">@if(pieceAt(i);as piece){<span class="checkers-piece" [class.checkers-piece--x]="piece.mark==='X'" [class.checkers-piece--o]="piece.mark==='O'" [class.checkers-piece--unavailable]="isUnavailableOwnPiece(i)"><span class="checkers-piece__mark">{{piece.mark}}</span>@if(piece.king){<span class="checkers-piece__king">♛</span>}</span>}@else if(ghostAt(i);as ghost){<span class="checkers-piece checkers-piece--ghost" [class.checkers-piece--x]="ghost.mark==='X'" [class.checkers-piece--o]="ghost.mark==='O'"><span class="checkers-piece__mark">{{ghost.mark}}</span>@if(ghost.king){<span class="checkers-piece__king">♛</span>}</span>}</button>}</div>
