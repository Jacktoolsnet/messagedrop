<app-dialog-header icon="toll" [title]="'common.contact.chatroom.decisions.newCoinTossTitle'|transloco"></app-dialog-header><mat-dialog-content class="coin-dialog"><p>{{'common.contact.chatroom.decisions.enterCoinOptions'|transloco}}</p><mat-form-field appearance="outline"><mat-label>{{'common.contact.chatroom.decisions.optionA'|transloco}}</mat-label><input matInput maxlength="40" [ngModel]="optionA()" (ngModelChange)="optionA.set($event)"></mat-form-field><mat-form-field appearance="outline"><mat-label>{{'common.contact.chatroom.decisions.optionB'|transloco}}</mat-label><input matInput maxlength="40" [ngModel]="optionB()" (ngModelChange)="optionB.set($event)" (keyup.enter)="submit()"></mat-form-field></mat-dialog-content><mat-dialog-actions class="sticky-actions"><button mat-icon-button class="action-close" (click)="close()"><mat-icon>close</mat-icon></button><button mat-icon-button color="primary" [disabled]="!valid()" (click)="submit()"><mat-icon>send</mat-icon></button></mat-dialog-actions>
