<app-dialog-header icon="map" [title]="'common.contact.chatroom.games.newTreasureMapTitle'|transloco"></app-dialog-header><mat-dialog-content class="new-game-content"><p>{{'common.contact.chatroom.games.placeTreasureItems'|transloco}}</p><app-treasure-map-placement (layoutChange)="layout.set($event)"></app-treasure-map-placement></mat-dialog-content><mat-dialog-actions class="sticky-actions"><button mat-icon-button class="action-close" (click)="close()"><mat-icon>close</mat-icon></button><button mat-icon-button [attr.aria-label]="'common.contact.chatroom.games.randomizeIslandAria'|transloco" (click)="randomize()"><mat-icon>refresh</mat-icon></button><button mat-icon-button color="primary" [disabled]="layout().filter(item=>item!==null).length!==18" (click)="send()"><mat-icon>send</mat-icon></button></mat-dialog-actions>
