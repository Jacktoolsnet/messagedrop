@if(game();as g){<section class="coin-toss"><div class="coin-options"><span class="coin-option coin-option--a" [class.coin-option--winner]="!animating()&&g.result==='A'" [attr.aria-label]="!animating()&&g.result==='A'?(('common.contact.chatroom.decisions.resultLabel'|transloco)+': '+g.optionA):null">@if(!animating()&&g.result==='A'){<mat-icon aria-hidden="true">emoji_events</mat-icon>}<span>{{g.optionA}}</span></span><span class="coin-options__or">{{'common.contact.chatroom.decisions.or'|transloco}}</span><span class="coin-option coin-option--b" [class.coin-option--winner]="!animating()&&g.result==='B'" [attr.aria-label]="!animating()&&g.result==='B'?(('common.contact.chatroom.decisions.resultLabel'|transloco)+': '+g.optionB):null">@if(!animating()&&g.result==='B'){<mat-icon aria-hidden="true">emoji_events</mat-icon>}<span>{{g.optionB}}</span></span></div><div class="coin-stage" [class.coin-stage--animating]="animating()"><div class="coin" [class.coin--flip-a]="animating()&&g.result==='A'" [class.coin--flip-b]="animating()&&g.result==='B'" [class.coin--result-b]="!animating()&&g.result==='B'"><div class="coin__face coin__face--a"><span>A</span></div><div class="coin__face coin__face--b"><span>B</span></div></div></div>@if(g.status==='active'){<button mat-fab extended color="primary" class="toss-button" type="button" [disabled]="disabled()" (click)="flip()"><mat-icon>toll</mat-icon>{{'common.contact.chatroom.decisions.tossCoin'|transloco}}</button>}</section>}
