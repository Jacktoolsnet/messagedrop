<div class="tic-tac-toe">
  <div class="tic-tac-toe__grid" role="grid" [attr.aria-label]="statusText()">
    @for (cell of cells(); track $index) {
    <button type="button" class="tic-tac-toe__cell" role="gridcell"
      [class.tic-tac-toe__cell--x]="cell === 'X'" [class.tic-tac-toe__cell--o]="cell === 'O'"
      [disabled]="disabled() || cell !== null" [attr.aria-label]="getCellAriaLabel($index, cell)"
      (click)="selectCell($index)">
      {{ cell || '' }}
    </button>
    }
  </div>
  @if (statusText()) {
  <div class="tic-tac-toe__status" aria-live="polite">{{ statusText() }}</div>
  }
</div>
