<div class="hide-seek">
 @if(isPlacement()){
  <div class="hide-seek__placement-status">{{ 'common.contact.chatroom.games.hideSeekPlaceCount'|transloco:{selected:selectedMines().length,total:mineCount} }}</div>
 }
 <div class="hide-seek-grid">
  @for(index of cells;track index){
   <button type="button" class="hide-seek-cell" [class.hide-seek-cell--revealed]="isRevealed(index)" [class.hide-seek-cell--mine]="isMineVisible(index)" [class.hide-seek-cell--selected]="selectedMines().includes(index)" [class.hide-seek-cell--last]="isLast(index)"
    [attr.data-adjacent]="isRevealed(index)&&!isMineVisible(index)?adjacent(index):null"
    [disabled]="disabled()||isBlockedForPlacement(index)||(!isPlacement()&&(!!isRevealed(index)||game()?.status!=='active'||round()?.seekerUserId!==currentUserId()))" (click)="selectCell(index)">
    @if(isMineVisible(index)){<mat-icon>emergency</mat-icon>}
    @else if(isRevealed(index)){<strong>{{adjacent(index)}}</strong>}
    @else{<mat-icon class="hide-seek-cell__hidden">crop_square</mat-icon>}
   </button>
  }
 </div>
 @if(isPlacement()&&!placementMode()){
  <button mat-mini-fab color="primary" class="hide-seek__submit" type="button" [disabled]="selectedMines().length!==mineCount" (click)="submitPlacement()" [attr.aria-label]="'common.contact.chatroom.games.confirmMinePlacementAria'|transloco"><mat-icon>check</mat-icon></button>
 }
</div>
