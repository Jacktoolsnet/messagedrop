<div class="hide-seek">
 @if(isPlacement()&&!isShowingRoundResult()){
  <div class="hide-seek__placement-status">{{ 'common.contact.chatroom.games.hideSeekPlaceCount'|transloco:{selected:selectedMines().length,total:mineCount} }}</div>
 }
 <div class="hide-seek-grid">
  @for(index of cells;track index){
   <button type="button" class="hide-seek-cell" [class.hide-seek-cell--revealed]="isRevealed(index)" [class.hide-seek-cell--mine]="isMineVisible(index)" [class.hide-seek-cell--selected]="selectedMines().includes(index)" [class.hide-seek-cell--last]="isLast(index)" [class.hide-seek-cell--exploded]="isExplosionAnimating(index)" [class.hide-seek-cell--defused]="isDefused(index)"
    [attr.data-adjacent]="isRevealed(index)&&!isMineVisible(index)?adjacent(index):null"
    [disabled]="disabled()||detonatingMine()!==null||isShowingRoundResult()||isBlockedForPlacement(index)||(!isPlacement()&&(!!isRevealed(index)||game()?.status!=='active'||round()?.seekerUserId!==currentUserId()))" (click)="selectCell(index)">
    @if(isMineVisible(index)){<span class="hide-seek-cell__bomb" aria-hidden="true">{{isDefused(index)?'🛡️':showsExplosion(index)?'💥':'💣'}}</span>}
    @else if(isRevealed(index)){
     @if(isCurrentUserHider()){<span class="hide-seek-cell__safe" aria-hidden="true">🌱</span>}
     @else{<strong>{{adjacent(index)}}</strong>}
    }
   </button>
  }
 </div>
 @if(isPlacement()&&!placementMode()&&!isShowingRoundResult()){
  <button mat-mini-fab color="primary" class="hide-seek__submit" type="button" [disabled]="selectedMines().length!==mineCount" (click)="submitPlacement()" [attr.aria-label]="'common.contact.chatroom.games.confirmMinePlacementAria'|transloco"><mat-icon>check</mat-icon></button>
 }
</div>
